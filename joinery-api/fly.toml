# fly.toml app configuration file generated for joinery-api-test on 2025-10-20T16:15:16+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "joinery-api-test"
primary_region = "ord"
console_command = "/rails/bin/rails console"

[build]
# Optionally pass build args
build_args = { RAILS_ENV = "staging" }

[env]
RAILS_ENV = "staging"
RAILS_LOG_TO_STDOUT = "true"
RAILS_SERVE_STATIC_FILES = "true"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

[[vm]]
memory = "512mb"
cpu_kind = "shared"
cpus = 1
